upstream qiuqiu_frontend {
    server 127.0.0.1:4173;
    keepalive 16;
}

# Loopback-only origin for Cloudflare Tunnel. Xray keeps public port 443.
server {
    listen 127.0.0.1:8080;
    server_name qiuqiu.reesia.xyz;
    server_tokens off;
    client_max_body_size 2m;

    # Claude hook transport is local-only. Never proxy this namespace from the public vhost.
    location ^~ /api/internal/ {
        return 403;
    }

    location / {
        proxy_pass http://qiuqiu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        add_header X-Accel-Buffering no always;
    }
}
