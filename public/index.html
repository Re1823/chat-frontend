<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat</title>
<script>
window.onerror = function(m, s, l, c) {
  document.body.insertAdjacentHTML('afterbegin',
    '<pre style="color:red;background:#fff;font-size:12px;padding:8px">' + m + '\n@' + l + ':' + c + '</pre>');
};
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f4;
    --surface: #ffffff;
    --text: #1c1c1c;
    --muted: #8a8a8a;
    --accent: #c65d34;
    --bubble-user: #c65d34;
    --bubble-user-text: #ffffff;
    --bubble-ai: #eeeeec;
    --bubble-ai-text: #1c1c1c;
    --border: #e2e2e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171716;
      --surface: #201f1e;
      --text: #ecebe9;
      --muted: #8f8c88;
      --bubble-user: #c65d34;
      --bubble-user-text: #fff;
      --bubble-ai: #2c2b29;
      --bubble-ai-text: #ecebe9;
      --border: #33322f;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft Yahei", sans-serif;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header p { margin: 0; font-size: 12px; color: var(--muted); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    color: var(--bubble-ai-text);
    border-bottom-left-radius: 4px;
  }
  .msg.pending { opacity: 0.6; }
  .msg.error {
    background: transparent;
    border: 1px solid #b3413a;
    color: #b3413a;
  }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    max-height: 120px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    border: none;
    background: var(--accent);
    color: white;
    border-radius: 12px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="dot"></div>
    <div>
      <h1>Claude Chat</h1>
      <p id="status">已连接</p>
    </div>
  </header>
  <div id="messages">
    <div id="empty">说点什么开始对话吧</div>
  </div>
  <form id="form" onsubmit="return false;">
    <textarea id="input" placeholder="输入消息…" rows="1"></textarea>
    <button id="sendBtn" type="button" onclick="sendMessage()">发送</button>
  </form>
</div>
<script>
var sessionId = (function() {
  var id = localStorage.getItem('chat_session_id');
  if (!id) {
    id = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    localStorage.setItem('chat_session_id', id);
  }
  return id;
})();

var messagesEl = document.getElementById('messages');
var input = document.getElementById('input');
var sendBtn = document.getElementById('sendBtn');
var emptyEl = document.getElementById('empty');

function addMessage(role, text, pending, error) {
  if (emptyEl && emptyEl.parentNode) { emptyEl.parentNode.removeChild(emptyEl); emptyEl = null; }
  var el = document.createElement('div');
  el.className = 'msg ' + role + (pending ? ' pending' : '') + (error ? ' error' : '');
  el.textContent = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

function sendMessage() {
  var text = input.value.replace(/^\s+|\s+$/g, '');
  if (!text || sendBtn.disabled) return;

  addMessage('user', text, false, false);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  var pending = addMessage('ai', '思考中…', true, false);

  fetch('/chat/api/chat', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sessionId: sessionId, message: text })
  }).then(function(res) {
    return res.json().then(function(data) {
      if (pending.parentNode) pending.parentNode.removeChild(pending);
      if (!res.ok) {
        addMessage('ai', data.error || '出错了', false, true);
      } else {
        addMessage('ai', data.result || data.reply || '(空回复)', false, false);
      }
    });
  }).catch(function(err) {
    if (pending.parentNode) pending.parentNode.removeChild(pending);
    addMessage('ai', err.message, false, true);
  }).then(function() {
    sendBtn.disabled = false;
    input.focus();
  });
}

input.addEventListener('input', function() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
